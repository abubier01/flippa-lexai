name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test-and-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

  drop-table-gate:
    # P8.1 — Asserts that contract_analyses has zero remaining dependencies
    # after applying all migrations 001..019, and that no stray runtime code
    # references the legacy table outside the allowed migration / helper /
    # known-Phase-9-cutover paths. Required check; blocks cutover regressions.
    name: drop-table-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start
        working-directory: ${{ github.workspace }}

      - name: Resolve DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> $GITHUB_ENV

      - name: Seed bootstrap admin auth user for migration 016
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO auth.users (
              id,
              aud,
              role,
              email,
              raw_app_meta_data,
              raw_user_meta_data,
              created_at,
              updated_at
            ) VALUES (
              '8a652f73-1f2d-407b-bf18-32a3ddd1b979',
              'authenticated',
              'authenticated',
              'alex.bubier@gmail.com',
              '{\"provider\":\"email\",\"providers\":[\"email\"]}'::jsonb,
              '{}'::jsonb,
              now(),
              now()
            )
            ON CONFLICT (id) DO NOTHING;
          "

      - name: Apply SQL migrations 001..019 in order
        run: |
          for f in $(ls scripts/[0-9][0-9][0-9]_*.sql | grep -v '\.down\.sql$' | sort); do
            echo "--- $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Assert zero contract_analyses dependencies
        run: |
          ROWS=$(psql "$DATABASE_URL" -tA -f scripts/_checks/contract_analyses_deps.sql | grep -v '^$' | wc -l | tr -d ' ')
          if [ "$ROWS" -ne 0 ]; then
            echo "❌ contract_analyses has $ROWS lingering dependencies:"
            psql "$DATABASE_URL" -f scripts/_checks/contract_analyses_deps.sql
            exit 1
          fi
          echo "✅ no contract_analyses dependencies"

      - name: Assert no stray contract_analyses runtime references
        run: |
          # Allowed paths (legitimate references that survive the cutover):
          #   - migration SQL (001/002/008/009/010/013/016/018 + their .down)
          #   - migration helpers (run_team_migration.mjs, migrate-teams.js)
          #   - dependency-check SQL
          #   - integration fixtures + tests asserting historic migration text
          #   - lib/contracts/read.ts header comment (historical context)
          #   - lib/admin/sql-migrations.ts metadata description string
          #   - docs/ (gitignored locally; PRs may add)
          ALLOWED='^(scripts/00[129]_|scripts/008_|scripts/010_|scripts/013_|scripts/016_|scripts/018_|scripts/_checks/|scripts/migrate-teams\.js|scripts/run_team_migration\.mjs|scripts/__tests__/team-viewer-rls\.test\.ts|scripts/_seed/|__tests__/integration/__fixtures__/seed-for-explain\.sql|app/api/contracts/chat/__tests__/route\.test\.ts|lib/contracts/read\.ts|lib/admin/sql-migrations\.ts|docs/)'

          git grep -lE '\bcontract_analyses\b' \
            | grep -vE "$ALLOWED" \
            > /tmp/stray.txt || true
          if [ -s /tmp/stray.txt ]; then
            echo "❌ Stray contract_analyses references outside allowed paths:"
            cat /tmp/stray.txt
            exit 1
          fi
          echo "✅ no new stray contract_analyses references"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  prod-build-checks:
    # P8.2 — Build-time fail-fast for GIT_SHA. The runtime check lives in
    # lib/prompt/core.ts (throws in production); this job surfaces the
    # mistake before the deploy even runs. Only enforced on main pushes.
    name: prod-build-checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert GIT_SHA is present for production build
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GIT_SHA" ]; then
            echo "❌ GIT_SHA env var required for production builds"
            exit 1
          fi
          echo "✅ GIT_SHA = $GIT_SHA"

  rls-gate:
    # P8.4 — Asserts analysis_runs is server-write-only: no non-SELECT RLS
    # policies, and no INSERT/UPDATE/DELETE grants to user-facing roles
    # (anon, authenticated). Required check.
    name: rls-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start
        working-directory: ${{ github.workspace }}

      - name: Resolve DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> $GITHUB_ENV

      - name: Seed bootstrap admin auth user for migration 016
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO auth.users (
              id,
              aud,
              role,
              email,
              raw_app_meta_data,
              raw_user_meta_data,
              created_at,
              updated_at
            ) VALUES (
              '8a652f73-1f2d-407b-bf18-32a3ddd1b979',
              'authenticated',
              'authenticated',
              'alex.bubier@gmail.com',
              '{\"provider\":\"email\",\"providers\":[\"email\"]}'::jsonb,
              '{}'::jsonb,
              now(),
              now()
            )
            ON CONFLICT (id) DO NOTHING;
          "

      - name: Apply SQL migrations 001..019 in order
        run: |
          for f in $(ls scripts/[0-9][0-9][0-9]_*.sql | grep -v '\.down\.sql$' | sort); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Assert no non-SELECT policies on analysis_runs
        run: |
          NON_SELECT=$(psql "$DATABASE_URL" -tA -c "
            SELECT count(*) FROM pg_policies
             WHERE tablename = 'analysis_runs' AND cmd <> 'SELECT'
          ")
          if [ "$NON_SELECT" -ne 0 ]; then
            echo "❌ analysis_runs has $NON_SELECT non-SELECT policies"
            psql "$DATABASE_URL" -c "SELECT policyname, cmd FROM pg_policies WHERE tablename='analysis_runs' AND cmd<>'SELECT';"
            exit 1
          fi
          echo "✅ no non-SELECT policies on analysis_runs"

      - name: Assert no INSERT/UPDATE/DELETE grants on analysis_runs to user roles
        run: |
          GRANTS=$(psql "$DATABASE_URL" -tA -c "
            SELECT count(*) FROM information_schema.role_table_grants
             WHERE table_name = 'analysis_runs'
               AND privilege_type IN ('INSERT','UPDATE','DELETE')
               AND grantee NOT IN ('service_role', 'postgres')
          ")
          if [ "$GRANTS" -ne 0 ]; then
            echo "❌ analysis_runs has $GRANTS user-role write grants"
            psql "$DATABASE_URL" -c "SELECT grantee, privilege_type FROM information_schema.role_table_grants WHERE table_name='analysis_runs' AND privilege_type IN ('INSERT','UPDATE','DELETE');"
            exit 1
          fi
          echo "✅ no user-role write grants on analysis_runs"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
